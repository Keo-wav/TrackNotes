version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tracknotes_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: DB_DEV_PASSWORD
      POSTGRES_DB: tracknotes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: