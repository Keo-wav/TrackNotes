<div class="track-sidebar">
  @for (track of trackService.projectTracks(); track track.id_track) {
    <div class="track-item" [class.active]="trackService.selectedTrack()?.id_track === track.id_track">
      <span>{{ track.track_name }}</span>
      <span class="version">v{{ track.version }}</span>
    </div>
  }
</div>
