<header>
  <div class="title-wrapper" [routerLink]="['/']">
    <svg width="32" height="32" viewBox="0 0 32 32">
      <rect x="6" y="10" width="4" height="12" rx="2" fill="#6366f1"/>
      <rect x="14" y="6" width="4" height="20" rx="2" fill="#6366f1"/>
      <rect x="22" y="14" width="4" height="8" rx="2" fill="#6366f1"/>
    </svg>
    <span class="brand-name">TrackNotes</span>
  </div>
  <div class="motto">
    <span>Collaborate with your bandmates and annihilate their artistic self-esteem 🔥</span>
  </div>
  <div>
    <ul class="nav-actions">
      @if (isDashboard()) {
        <li class="nav-link" (click)="onAddNewProject()">ADD PROJECT</li>
      }

      @if (isProjectPage()) {
        <li class="nav-link" (click)="onAddNewTrack()">ADD TRACK</li>
      }
    </ul>
  </div>
</header>
