<div class="studio-container">
  <aside class="sidebar">
    <app-track-list></app-track-list>
  </aside>

  <main class="main-stage">
    @if (trackService.selectedTrack(); as track) {
      <app-track-player [track]="track"></app-track-player>
      <app-track-comments></app-track-comments>
    } @else {
      <div class="empty-state">Select a track to start editing</div>
    }
  </main>
</div>
